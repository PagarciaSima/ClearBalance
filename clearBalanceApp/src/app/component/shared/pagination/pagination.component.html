<nav class="mt-3 mb-3" aria-label="Pagination">
  <div class="container-fluid px-0">
    <div class="row g-2 align-items-center flex-column flex-md-row">
      <div class="col-12 col-md-auto order-2 order-md-1 d-flex justify-content-center justify-content-md-start">
        <ul class="pagination mb-2 mb-md-0 flex-wrap justify-content-center">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" (click)="goToFirst()">First</button>
          </li>
          <li class="page-item" [class.disabled]="currentPage === 1">
            <button class="page-link" (click)="goToPrevious()">Previous</button>
          </li>
          <li class="page-item" *ngFor="let page of pages" [class.active]="page === currentPage">
            <button class="page-link" (click)="goToPage(page)">{{ page }}</button>
          </li>
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <button class="page-link" (click)="goToNext()">Next</button>
          </li>
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <button class="page-link" (click)="goToLast()">Last</button>
          </li>
        </ul>
      </div>
      <div class="col-12 col-md-auto order-1 order-md-2 d-flex flex-wrap justify-content-center justify-content-md-end align-items-center gap-2">
        <span class="text-nowrap small text-secondary d-flex align-items-center">
          <i class="bi bi-list-ul me-1"></i>
          <span class="text-white">{{ totalItems }} result{{ totalItems === 1 ? '' : 's' }}</span>
        </span>
        <label for="pageSizeSelect" class="me-2 mb-0">Page size:</label>
        <select id="pageSizeSelect" class="form-select d-inline-block w-auto" [(ngModel)]="pageSize" (change)="handlePageSizeChange($event)">
          <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
        </select>
      </div>
    </div>
  </div>
</nav>

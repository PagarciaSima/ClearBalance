<!-- ========================= UFO DECORATIVE ANIMATIONS ========================= -->
<app-ufo 
  *ngFor="let ufo of ufos; let i = index" 
  [attr.data-ufo-index]="i"
  [attr.aria-hidden]="true">
</app-ufo>

<!-- ========================= 404 ERROR PAGE ========================= -->
<section role="main" aria-labelledby="error-heading">
  <div class="container" @bounceIn>
    <div class="row justify-content-center">
      <div class="col-md-6 mt-3">
        <div class="card">
          <div class="card-body">
            
            <!-- ========================= HEADER ========================= -->
            <header class="text-center">
              <h1 class="h2 text-white">
                <i class="bi bi-safe me-3" aria-hidden="true"></i>
                ClearBalance
              </h1>
              <h2 class="card-title mt-4 mb-3 h5" id="error-heading">
                404 - Page Not Found
              </h2>
            </header>

            <!-- ========================= ERROR MESSAGE ========================= -->
            <div class="text-center" role="alert" aria-live="polite">
              <div class="error-number" aria-label="Error code 404">404</div>
              <p class="mt-3 mb-4 text-white">
                <i class="bi bi-emoji-frown me-2" aria-hidden="true"></i>
                It seems this page has been abducted by a UFO.
              </p>
              <p class="text-white mb-0">
                The page you're looking for doesn't exist or has been moved.
              </p>
            </div>

            <!-- ========================= NAVIGATION BUTTONS ========================= -->
            <nav class="d-flex flex-column flex-sm-row justify-content-center gap-2 mb-4 mt-4" aria-label="Navigation options">
              <button 
                type="button"
                class="btn btn-primary" 
                routerLink="/auth/login"
                aria-label="Return to home page">
                <i class="bi bi-house-door me-2" aria-hidden="true"></i>
                Back to Home
              </button>
              <button 
                type="button"
                class="btn btn-outline-light" 
                (click)="goBack()"
                aria-label="Go back to previous page">
                <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>
                Go Back
              </button>
            </nav>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

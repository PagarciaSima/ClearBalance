<section *ngIf="(resetPasswordState$ | async) as state" [ngSwitch]="state.dataState">
    <div *ngIf="!state.registerSuccess" class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 mt-3 pb-0">
          <div class="card">
            <div class="card-body">
              <div class="text-center">
                <h2><i class="bi bi-safe me-2"></i>Clear Balance</h2>
                <h5 class="card-title mt-4 mb-5">Reset Password</h5>
              </div>
              <div *ngIf="state.dataState === DataState.ERROR" class="alert alert-danger bg-danger text-light border-0 alert-dismissible fade show" role="alert">
                {{ state.error }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
              <form #resetPasswordForm="ngForm" (ngSubmit)="resetPassword(resetPasswordForm)">
                <div class="form-outline mb-4">
                  <label class="form-label" for="email">
                    <i class="bi bi-envelope me-2" aria-hidden="true"></i>
                    Email Address
                  </label>
                  <input type="text" [disabled]="state.dataState === DataState.LOADING" ngModel name="email" class="form-control" required minlength="2">
                </div>
                <div class="d-flex justify-content-center mb-4">
                  <button [disabled]="state.dataState === DataState.LOADING || resetPasswordForm.invalid || resetPasswordForm.pristine" type="submit" class="btn btn-primary w-100">
                    <span *ngIf="state.dataState === DataState.LOADING" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    <span *ngIf="state.dataState === DataState.LOADING">Loading...</span>
                    <span *ngIf="!(state.dataState === DataState.LOADING)"><i class="bi bi-key me-2"></i>Reset Password</span>
                  </button>
                </div>
              </form>
              <div class="row mb-4">
                <div class="col d-flex justify-content-center">
                  <a [ngStyle]="{'pointer-events' : state.dataState === DataState.LOADING ? 'none' : 'auto'}" [routerLink]="['/login']">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Account Login
                  </a>
                </div>
                <div class="col">
                  <a [ngStyle]="{'pointer-events' : state.dataState === DataState.LOADING ? 'none' : 'auto'}" [routerLink]="['/register']">
                    <i class="bi bi-person-plus me-2"></i>Create an Account
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Success screen -->
    <div *ngIf="state.registerSuccess" class="container">
      <div class="row justify-content-center mt-3">
        <div class="col-md-6" style="margin-top: 50px;">
          <div class="card">
            <div class="card-body">
              <div class="text-center">
                <h2><i style="margin-right: 5px;" class="bi bi-safe"></i>Clear Balance</h2>
                <h5 class="card-title mt-4 mb-4">Reset Password</h5>
                <i class="bi bi-check-circle-fill success-icon"></i>
                <p class="mt-2" style="font-size: 20px;">{{ state.message }}</p>
              </div>
              <div class="row mb-4">
                <div class="col d-flex justify-content-center">
                  <a [routerLink]="['/login']">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Account Login
                  </a>
                </div>
                <div class="col">
                  <a [routerLink]="['/register']">
                    <i class="bi bi-person-plus me-2"></i>Create an Account
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

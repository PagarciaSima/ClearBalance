<!-- ========================= HOME COMPONENT TEMPLATE ========================= -->
<ng-container *ngIf="(homeState$ | async) as state">

  <ng-container>

    <!-- ========================= STATISTICS SECTION ========================= -->
    <app-stats></app-stats>

    <!-- ========================= MAIN CONTENT SECTION ========================= -->
    <section aria-labelledby="customers-title">
      <div class="container mt-5">
        <!-- ========================= CUSTOMERS CARD ========================= -->
        <div class="row card" [@slideBlur]>

          <!-- ========================= PROGRESS BAR ========================= -->
          <div class="col-12 mt-5" *ngIf="isLoading$ | async">
            <div class="progress" role="progressbar" aria-label="Customer data loading progress" aria-valuenow="100"
              aria-valuemin="0" aria-valuemax="100">
              <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width: 100%;">
                <span class="visually-hidden">Loading...</span>
                Loading...
              </div>
            </div>
          </div>

          <!-- ========================= HEADER ROW ========================= -->
          <div class="col mt-3">
            <h4 id="customers-title" class="fw-bold text-start text-white">
              <i class="bi bi-people-fill me-2" aria-hidden="true"></i>Customers
            </h4>
          </div>
          <div class="col">
            <div class="fw-bold text-end">
              <button type="button" class="mb-3 btn btn-link p-0 border-0 bg-transparent" data-bs-toggle="tooltip"
                data-bs-placement="top" title="Export customers to Excel" aria-label="Export customers to Excel">
                <i class="bi bi-file-earmark-excel success-icon fs-1 mb-0" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <!-- ========================= CUSTOMERS TABLE ========================= -->
          <div class="col-12">
            <table class="table table-hover" aria-label="Customers list">
              <thead>
                <tr>
                  <th class="text-center" scope="col">
                    <i class="bi bi-hash me-2" aria-hidden="true"></i>ID
                  </th>
                  <th scope="col">
                    <i class="bi bi-person-circle me-2" aria-hidden="true"></i>Photo
                  </th>
                  <th scope="col">
                    <i class="bi bi-person me-2" aria-hidden="true"></i>Name
                  </th>
                  <th scope="col">
                    <i class="bi bi-envelope me-2" aria-hidden="true"></i>Email
                  </th>
                  <th scope="col">
                    <i class="bi bi-telephone me-2" aria-hidden="true"></i>Phone
                  </th>
                  <th scope="col">
                    <i class="bi bi-circle-fill me-2" aria-hidden="true"></i>Status
                  </th>
                  <th scope="col">
                    <i class="bi bi-star me-2" aria-hidden="true"></i>Type
                  </th>
                  <th scope="col">
                    <i class="bi bi-gear me-2" aria-hidden="true"></i>Action
                  </th>
                </tr>
              </thead>
              <tbody class="table-body">
                <tr *ngFor="let customer of state?.appData?.data?.customers?.content">
                  <th class="text-center" scope="row">{{ customer.id }}</th>
                  <td>
                    <img [src]="customer.imageUrl || 'assets/img/astronaut.png'" width="42" height="42" class="rounded-circle"
                        [alt]="'Profile picture of ' + customer.name"
                        tabindex="0"
                        data-bs-toggle="popover"
                        data-bs-trigger="hover focus"
                        data-bs-html="true"
                        [attr.data-bs-content]="'<img src=\'' + (customer.imageUrl || 'assets/img/astronaut.png') + '\' style=\'width:120px;height:120px;max-width:120px;max-height:120px;object-fit:cover;border-radius:16px;display:block;\' alt=\'Profile picture of ' + customer.name + '\'/>'"
                        data-bs-placement="left"
                    >
                  </td>
                  <td>{{ customer.name }}</td>
                  <td>{{ customer.email }}</td>
                  <td>{{ customer.phone }}</td>
                  <td>
                    <span class="badge" [ngClass]="customer.status | customerStatus" role="status">
                      {{ customer.status }}
                    </span>
                  </td>
                  <td>{{ customer.type | capitalize }}</td>

                  <td>
                    <button type="button" class="btn btn-primary" data-bs-toggle="tooltip" data-bs-placement="top"
                      [title]="'View customer details for ' + customer.name"
                      (click)="selectCustomer(customer)"
                    >
                      View
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>

            <!-- ========================= PAGINATION ========================= -->
            <app-pagination
              [currentPage]="(state.appData?.data?.customers?.number ?? 0) + 1"
              [totalPages]="state.appData?.data?.customers?.totalPages ?? 1"
              [pageSize]="customerPageSize"
              [pageSizeOptions]="[5, 10, 20]"
              [totalItems]="state.appData?.data?.customers?.totalElements ?? 0"
              (pageChange)="onCustomerPageChange($event - 1)"
              (pageSizeChange)="onCustomerPageSizeChange($event)">
            </app-pagination>
          </div>
        </div>
      </div>
    </section>
  </ng-container>
</ng-container>

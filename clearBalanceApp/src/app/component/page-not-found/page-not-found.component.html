<app-ufo *ngFor="let ufo of ufos; let i = index" [attr.data-ufo-index]="i"></app-ufo>
<section role="main" aria-labelledby="error-heading">
    <div class="container" @bounceIn>
        <div class="row justify-content-center my-5">
            <div class="col-md-6 mt-3">
                <div class="card">
                    <div class="card-body">
                        <div class="text-center">
                            <h2><i style="margin-right: 5px;" class="bi bi-safe me-3" aria-hidden="true"></i>ClearBalance</h2>
                            <h5 class="card-title mt-4 mb-3" id="error-heading">404 - Page Not Found</h5>
                            
                            <!-- Error Message -->
                            <div class="error-number" role="img" aria-label="Error 404">404</div>
                            <p class="mt-3 mb-4">
                                <i class="bi bi-emoji-frown me-2" aria-hidden="true"></i>
                                It seems this page has been abducted by a UFO.
                            </p>
                            <p class="text-white mb-0">
                                The page you're looking for doesn't exist or has been moved.
                            </p>
                        </div>
                        
                        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 mb-4 mt-4">
                            <button class="btn btn-primary" 
                                    routerLink="/login"
                                    aria-label="Navigate to home page">
                                <i class="bi bi-house-door me-2" aria-hidden="true"></i>
                                Back to Home
                            </button>
                            <button class="btn btn-outline-light" 
                                    (click)="goBack()"
                                    aria-label="Go back to previous page">
                                <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>
                                Go Back
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

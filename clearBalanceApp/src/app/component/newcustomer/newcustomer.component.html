<!-- New Customer Component: Main State Switch -->
<ng-container *ngIf="(newCustomerState$ | async) as state" [ngSwitch]="state.dataState">
    <!-- Data Loaded State -->
    <ng-container *ngSwitchCase="DataState.LOADED">
        <section class="newcustomer-section">
            <div class="container mt-4">
                <!-- Breadcrumb Navigation -->
                <div class="row justify-content-center card">
                    <nav aria-label="breadcrumb" style="margin-top: 8px;">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item">
                                <a [routerLink]="['/']" data-bs-toggle="tooltip" data-bs-placement="left"
                                    title="Go to home page">
                                    <i class="bi bi-house-door me-2"></i>Home
                                </a>
                            </li>
                            <li class="breadcrumb-item">
                                <a [routerLink]="['/customers']" data-bs-toggle="tooltip" data-bs-placement="left"
                                    title="Go to customers">
                                    <i class="bi bi-people me-2"></i>Customers
                                </a>
                            </li>
                            <li class="breadcrumb-item active" aria-current="page">
                                <i class="bi bi-person-plus-fill me-2"></i><span class="text-white">New</span>
                            </li>
                        </ol>
                    </nav>
                </div>
                <!-- New Customer Form Card -->
                <div class="row justify-content-center">
                    <div class="card">
                        <div class="card-body p-4">
                            <!-- Form Title -->
                            <div class="text-center mb-4">
                                <h2><i class="bi bi-person-plus-fill me-2"></i>New Customer</h2>
                            </div>
                            <!-- Error Alert -->
                            <div *ngIf="state.error"
                                class="alert alert-danger bg-danger text-light border-0 alert-dismissible fade show"
                                role="alert">
                                {{ state.error }}
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"
                                    aria-label="Close"></button>
                            </div>
                            <!-- New Customer Form -->
                            <form #newCustomerForm="ngForm" (ngSubmit)="createCustomer(newCustomerForm)" aria-label="New Customer Form">
                                <div class="row g-3">
                                    <!-- Name Field -->
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="name"><i class="bi bi-person me-2"></i>Name</label>
                                            <input id="name" type="text" ngModel name="name" class="form-control" required aria-required="true" autocomplete="name">
                                        </div>
                                    </div>
                                    <!-- Email Field -->
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="email"><i class="bi bi-envelope me-2"></i>Email</label>
                                            <input id="email" type="email" ngModel name="email" class="form-control" required aria-required="true" autocomplete="email">
                                        </div>
                                    </div>
                                    <!-- Address Field -->
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="address"><i class="bi bi-geo-alt me-2"></i>Address</label>
                                            <input id="address" type="text" ngModel name="address" class="form-control" required aria-required="true" autocomplete="street-address">
                                        </div>
                                    </div>
                                    <!-- Phone Field -->
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="phone"><i class="bi bi-telephone me-2"></i>Phone</label>
                                            <input id="phone" type="tel" ngModel name="phone" class="form-control" required aria-required="true" autocomplete="tel">
                                        </div>
                                    </div>
                                    <!-- Type Field -->
                                    <div class="col-md-6">
                                        <label for="type"><i class="bi bi-person-badge me-2"></i>Type</label>
                                        <select id="type" name="type" ngModel="INDIVIDUAL" class="form-control" required aria-required="true">
                                            <option value="INDIVIDUAL">Individual</option>
                                            <option value="INSTITUTION">Institution</option>
                                        </select>
                                    </div>
                                    <!-- Status Field -->
                                    <div class="col-md-6">
                                        <label for="status"><i class="bi bi-check-circle me-2"></i>Status</label>
                                        <select id="status" name="status" ngModel="ACTIVE" class="form-control" required aria-required="true">
                                            <option value="ACTIVE">Active</option>
                                            <option value="BANNED">Banned</option>
                                            <option value="PENDING">Pending</option>
                                            <option value="INACTIVE">Inactive</option>
                                        </select>
                                    </div>
                                    <!-- Image URL Field -->
                                    <div class="col-md-12">
                                        <div class="form-group">
                                            <label for="imageUrl"><i class="bi bi-image me-2"></i>Image URL</label>
                                            <input id="imageUrl" type="url" ngModel name="imageUrl" class="form-control" required aria-required="true" autocomplete="url">
                                        </div>
                                    </div>
                                </div>
                                <!-- Submit Button -->
                                <div class="mt-4 text-center">
                                    <button
                                        [disabled]="state.dataState === DataState.LOADING || newCustomerForm.invalid || newCustomerForm.pristine || (isLoading$ | async)"
                                        type="submit" class="btn btn-primary px-5">
                                        <span *ngIf="isLoading$ | async" class="spinner-border spinner-border-sm"
                                            role="status" aria-hidden="true" style="margin-right: 5px;"></span>
                                        <span *ngIf="isLoading$ | async">Saving...</span>
                                        <span *ngIf="!(isLoading$ | async)">Save Customer</span>
                                    </button>
                                </div>
                            </form>
                            <!-- End New Customer Form -->
                        </div>
                    </div>
                </div>
                <!-- End New Customer Form Card -->
            </div>
        </section>
    </ng-container>
</ng-container>

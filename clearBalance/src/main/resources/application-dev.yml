spring:
  datasource:
    url: jdbc:mysql://localhost:3306/clearbalance
    username: root
    password: admin

  jpa:
    database-platform: org.hibernate.dialect.MySQL8InnoDBDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[globally_quoted_identifiers]": true
        dialect: org.hibernate.dialect.MySQL8Dialect
        "[format_sql]": true

  sql:
    init:
      mode: never
      continue-on-error: true
      
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_DIR}
    from: Clear Balance <${EMAIL_DIR}>
    password: ${EMAIL_PASS}
    properties:
      mail:
        smtp:
          writetimeout: 5000
          connectiontimeout: 5000
          timeout: 5000
          auth: true
          starttls:
            enable: true
            required: true
      
logging:
  level:
    "[org.springframework.security]": DEBUG
    "[org.springframework.security.web.authentication]": DEBUG
    "[org.springframework.security.authentication]": DEBUG
